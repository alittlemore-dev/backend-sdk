[project]
name = "alittlemore-backend-sdk"
version = "0.1.0"
description = "Shared backend building blocks for alittlemore.dev services."
readme = ".github/README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitriy Lunev", email = "d.lunev.dev@gmail.com" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
auth-http = ["httpx>=0.28,<0.29"]
litestar = ["httpx>=0.28,<0.29", "litestar>=2.24,<3"]

[project.urls]
Repository = "https://github.com/alittlemore-dev/backend-sdk"
Issues = "https://github.com/alittlemore-dev/backend-sdk/issues"
Changelog = "https://github.com/alittlemore-dev/backend-sdk/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bandit>=1.9.4,<2",
    "genbadge[coverage]>=1.1.3,<2",
    "hatchling>=1.27,<2",
    "httpx>=0.28,<0.29",
    "litestar>=2.24,<3",
    "mypy>=2.3.1,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.3,<0.17",
    "twine>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/.github/README.md",
    "/.github/README_RU.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "S", "PT", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["backend_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 95

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
