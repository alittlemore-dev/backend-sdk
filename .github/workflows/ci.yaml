name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/badges/**'
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.15'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: make quality
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.14'
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.14'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  coverage-badge:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.15'
          python-version: '3.14'
          enable-cache: true
      - uses: actions/download-artifact@a5a5461e7c63e2034f94d8a5b11f265b73ba33 # v8.0.1
        with:
          name: coverage
          path: .
      - name: Generate coverage badge
        run: uv run --locked genbadge coverage -n backend -i coverage.xml -o .github/badges/coverage-backend.svg
      - name: Commit changed coverage badge
        run: |
          if git diff --quiet -- .github/badges/coverage-backend.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/badges/coverage-backend.svg
          git commit -m 'chore: update coverage badge'
          git push
